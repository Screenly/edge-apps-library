version: 2
# Note: The directories key (plural) supports globbing and wildcards, unlike directory (singular).
# See: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#directories-or-directory--

updates:
  - package-ecosystem: 'npm'
    directories:
      - '/'
    schedule:
      interval: 'weekly'
    ignore:
      # typescript-eslint declares a peer range of typescript ">=4.8.4 <6.1.0",
      # and its latest release still does. Bumping typescript to 7 makes
      # `npm ci` fail outright with ERESOLVE, which takes every job with it.
      # Remove this once typescript-eslint supports TypeScript 7.
      - dependency-name: 'typescript'
        versions: ['>=7']
    groups:
      npm:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
