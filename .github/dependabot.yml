version: 2
# Note: The directories key (plural) supports globbing and wildcards, unlike directory (singular).
# See: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#directories-or-directory--

updates:
  - package-ecosystem: 'npm'
    directories:
      - '/'
    schedule:
      interval: 'weekly'
    groups:
      npm:
        patterns:
          - '*'
    # typescript-eslint does not support TypeScript 7 yet: its peer range is
    # ">=4.8.4 <6.1.0" as of typescript-eslint 8.70.0, and TypeScript 7 removed
    # the `ts.Extension.Cjs` API that @typescript-eslint/typescript-estree reads,
    # which breaks linting. Remove this once typescript-eslint supports TS 7.
    ignore:
      - dependency-name: 'typescript'
        versions: ['>=7.0.0']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
