version: 2
# Note: The directories key (plural) supports globbing and wildcards, unlike directory (singular).
# See: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#directories-or-directory--

updates:
  - package-ecosystem: 'npm'
    directories:
      - '/'
    schedule:
      interval: 'weekly'
    groups:
      npm:
        patterns:
          - '*'
    ignore:
      # typescript-eslint 8.x declares peer typescript '>=4.8.4 <6.1.0'; TypeScript 7
      # makes `npm ci` fail with ERESOLVE. Remove once typescript-eslint supports it.
      - dependency-name: 'typescript'
        versions:
          - '>=7'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
